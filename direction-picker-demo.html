<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Flaneur — Direction Picker Widget</title>
<link rel="stylesheet" href="https://unpkg.com/augmented-ui@2/augmented-ui.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>

<!-- Leaflet for the OSM background layer -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
/* ── Tokens (matches main app) ───────────────────────────── */
:root {
  --bg:          #070b14;
  --bg-panel:    #0d1220;
  --bg-modal:    #0a0f1c;
  --border:      #1a2840;
  --accent:      #00ffe5;
  --accent-dim:  #00a89a;
  --accent2:     #ff3c6e;
  --accent3:     #ffe600;
  --text:        #c8dce8;
  --text-dim:    #607080;
  --success:     #00ff88;
  --warn:        #ff9900;
  --aug-border-all: 1px;
  --aug-border-bg: var(--border);
  --aug-tl: 10px;
  --aug-br: 10px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100dvh;
  gap: 16px;
  padding: 20px;
}

h1 {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--accent-dim);
  text-transform: uppercase;
}

/* ── Demo trigger button ────────────────────────────────────── */
.btn-set-direction {
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 9px 20px;
  background: rgba(0,255,229,0.07);
  border: none;
  color: var(--accent);
  cursor: pointer;
  --aug-tl: 8px; --aug-br: 8px;
  --aug-border-all: 1px;
  --aug-border-bg: var(--accent-dim);
  transition: background 0.15s;
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn-set-direction:hover { background: rgba(0,255,229,0.14); }
.btn-set-direction svg { width: 16px; height: 16px; }

/* ── Overlay backdrop ───────────────────────────────────────── */
#dir-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(7,11,20,0.55);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
#dir-overlay.visible {
  opacity: 1;
  pointer-events: all;
}

/* ── Widget container (map background clips to this) ──────── */
#dir-widget {
  position: relative;
  width: min(320px, 90vw);
  height: min(320px, 90vw);
  border-radius: 50%;
  overflow: hidden;
  box-shadow: 0 0 0 1px var(--accent-dim),
              0 0 40px rgba(0,255,229,0.12),
              0 0 0 8px rgba(7,11,20,0.6);
}

/* ── OSM map inside widget ────────────────────────────────── */
#dir-map {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  filter: brightness(0.45) saturate(0.6);
  pointer-events: none;
}

/* ── SVG canvas on top of map ─────────────────────────────── */
#dir-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  touch-action: none;
  cursor: crosshair;
  overflow: visible;
}

/* ── Outer compass ring (always shown) ────────────────────── */
.compass-ring {
  fill: none;
  stroke: rgba(0,255,229,0.15);
  stroke-width: 1;
}
.compass-ring-outer {
  stroke: rgba(0,255,229,0.08);
  stroke-width: 1;
  stroke-dasharray: 4 8;
}

/* ── Direction beam / wedge ───────────────────────────────── */
#dir-beam {
  display: none;
}

/* ── Center circle ────────────────────────────────────────── */
.center-dot {
  fill: var(--accent);
  filter: drop-shadow(0 0 6px rgba(0,255,229,0.8));
}
.center-ring {
  fill: none;
  stroke: var(--accent);
  stroke-width: 1.5;
  opacity: 0.4;
}
/* Pulse animation on center */
.center-ring.pulse {
  animation: ring-pulse 1.4s ease-in-out infinite;
}
@keyframes ring-pulse {
  0%   { r: 14; opacity: 0.4; }
  50%  { r: 22; opacity: 0.1; }
  100% { r: 14; opacity: 0.4; }
}

/* ── Cardinal tick marks ──────────────────────────────────── */
.cardinal-tick { stroke: rgba(0,255,229,0.25); stroke-width: 1; }
.cardinal-tick-major { stroke: rgba(0,255,229,0.5); stroke-width: 1.5; }
.cardinal-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  fill: rgba(0,255,229,0.5);
  text-anchor: middle;
  dominant-baseline: middle;
}
.cardinal-label-nsew {
  font-size: 13px;
  font-weight: bold;
  fill: rgba(0,255,229,0.7);
}

/* ── Live readout inside widget ───────────────────────────── */
#dir-readout {
  position: absolute;
  bottom: 18%;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
}
#dir-readout.visible { opacity: 1; }

#dir-readout .deg {
  font-family: 'Share Tech Mono', monospace;
  font-size: 28px;
  color: var(--accent);
  line-height: 1;
  text-shadow: 0 0 12px rgba(0,255,229,0.6);
}
#dir-readout .card {
  font-family: 'Share Tech Mono', monospace;
  font-size: 13px;
  color: var(--accent-dim);
  letter-spacing: 0.1em;
  margin-top: 2px;
}

/* ── Dismiss / close area outside widget circle ──────────── */
#dir-dismiss {
  position: fixed;
  inset: 0;
  z-index: -1;
  cursor: default;
}

/* ── Confirm button ───────────────────────────────────────── */
#btn-dir-confirm {
  position: absolute;
  bottom: -54px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 8px 24px;
  background: rgba(0,255,229,0.1);
  border: none;
  color: var(--accent);
  cursor: pointer;
  white-space: nowrap;
  --aug-tl: 6px; --aug-br: 6px;
  --aug-border-all: 1px;
  --aug-border-bg: var(--accent);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, background 0.15s;
}
#btn-dir-confirm.visible {
  opacity: 1;
  pointer-events: all;
}
#btn-dir-confirm:hover { background: rgba(0,255,229,0.2); }

#btn-dir-cancel {
  position: absolute;
  bottom: -54px;
  right: calc(50% - 140px);
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 8px 16px;
  background: transparent;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  --aug-tl: 6px; --aug-br: 6px;
  --aug-border-all: 1px;
  --aug-border-bg: var(--border);
}
#btn-dir-cancel:hover { color: var(--text); }

/* ── Save-status flash (upper-right) ─────────────────────── */
#dir-save-status {
  position: fixed;
  top: max(14px, env(safe-area-inset-top, 14px));
  right: 14px;
  z-index: 2000;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  padding: 7px 14px;
  background: var(--bg-modal);
  border: 1px solid var(--accent-dim);
  color: var(--accent);
  pointer-events: none;
  opacity: 0;
  transform: translateY(-6px);
  transition: opacity 0.18s, transform 0.18s;
  --aug-tl: 6px; --aug-br: 6px;
  --aug-border-all: 1px;
  --aug-border-bg: var(--accent-dim);
  line-height: 1.6;
}
#dir-save-status .status-label {
  color: var(--text-dim);
  font-size: 9px;
  display: block;
  letter-spacing: 0.15em;
  margin-bottom: 1px;
}
#dir-save-status .status-value {
  color: var(--accent);
  font-size: 14px;
}
#dir-save-status.visible {
  opacity: 1;
  transform: translateY(0);
}

/* Demo result readout */
#demo-result {
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px;
  color: var(--text-dim);
  text-align: center;
  min-height: 20px;
}
#demo-result strong { color: var(--accent); }
</style>
</head>
<body>

<h1>Flaneur OSM Recorder — Direction Picker Widget</h1>

<button class="btn-set-direction" id="btn-open" augmented-ui="tl-clip br-clip exe">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="12" cy="12" r="10"/>
    <polyline points="12 2 12 6"/><polyline points="12 18 12 22"/>
    <polyline points="2 12 6 12"/><polyline points="18 12 22 12"/>
    <circle cx="12" cy="12" r="2" fill="currentColor"/>
  </svg>
  Set Camera Direction
</button>

<div id="demo-result">No direction set yet.</div>

<!-- ─── Direction Picker Overlay ───────────────────────────── -->
<div id="dir-overlay" role="dialog" aria-label="Direction picker" aria-modal="true">
  <div style="position:relative; display:flex; align-items:center; justify-content:center;">
    <div id="dir-widget">
      <!-- OSM map background -->
      <div id="dir-map"></div>

      <!-- Interactive SVG overlay -->
      <svg id="dir-canvas" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
        <!-- Dashed outer ring -->
        <circle class="compass-ring-outer" cx="160" cy="160" r="148"/>
        <!-- Main compass ring -->
        <circle class="compass-ring" cx="160" cy="160" r="130"/>
        <!-- Fine tick marks (every 10°) -->
        <g id="ticks-minor"></g>
        <!-- Cardinal / intercardinal ticks and labels -->
        <g id="ticks-major"></g>
        <!-- Direction beam (wedge + ray) -->
        <g id="dir-beam">
          <path id="dir-wedge" fill="rgba(0,255,229,0.12)" stroke="none"/>
          <line id="dir-ray"
            x1="160" y1="160" x2="160" y2="160"
            stroke="var(--accent)" stroke-width="2"
            stroke-linecap="round"
            style="filter:drop-shadow(0 0 4px rgba(0,255,229,0.7))"/>
          <!-- Arrowhead at tip -->
          <polygon id="dir-arrow"
            fill="var(--accent)"
            style="filter:drop-shadow(0 0 5px rgba(0,255,229,0.8))"/>
          <!-- Endpoint dot -->
          <circle id="dir-tip" r="5" fill="var(--accent)"
            style="filter:drop-shadow(0 0 6px rgba(0,255,229,0.9))"/>
        </g>
        <!-- Pulsing center ring -->
        <circle class="center-ring pulse" cx="160" cy="160" r="14"/>
        <!-- Center dot (draggable origin) -->
        <circle class="center-dot" cx="160" cy="160" r="7"/>
      </svg>

      <!-- Live degree + cardinal readout -->
      <div id="dir-readout">
        <div class="deg" id="readout-deg">0°</div>
        <div class="card" id="readout-card">N</div>
      </div>
    </div>

    <!-- Confirm / cancel buttons (below circle) -->
    <button id="btn-dir-confirm" augmented-ui="tl-clip br-clip exe">✓ Confirm Direction</button>
    <button id="btn-dir-cancel" augmented-ui="tl-clip br-clip exe">Cancel</button>
  </div>

  <div id="dir-dismiss"></div>
</div>

<!-- Save-status flash -->
<div id="dir-save-status" augmented-ui="tl-clip br-clip exe">
  <span class="status-label">SAVING DIRECTION</span>
  <span class="status-value" id="save-status-value">—</span>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// DirectionPicker — reusable module
// ═══════════════════════════════════════════════════════════════════

const DirectionPicker = (() => {
  'use strict';

  // ── Cardinal direction lookup ──────────────────────────────────
  const CARDINALS = [
    'N','NNE','NE','ENE','E','ESE','SE','SSE',
    'S','SSW','SW','WSW','W','WNW','NW','NNW'
  ];

  function degreesToCardinal(deg) {
    const normalized = ((deg % 360) + 360) % 360;
    const idx = Math.round(normalized / 22.5) % 16;
    return CARDINALS[idx];
  }

  function normalizeAngle(deg) {
    return ((deg % 360) + 360) % 360;
  }

  // ── SVG helpers ───────────────────────────────────────────────
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const CX = 160, CY = 160;       // SVG center
  const RING_R  = 130;            // compass ring radius
  const BEAM_R  = 118;            // how far the ray tip travels
  const DEAD_R  = 18;             // dead zone radius (no drag registered)

  function polarToXY(angleDeg, r, cx = CX, cy = CY) {
    const rad = (angleDeg - 90) * (Math.PI / 180);
    return {
      x: cx + r * Math.cos(rad),
      y: cy + r * Math.sin(rad),
    };
  }

  // ── Build tick marks ──────────────────────────────────────────
  function buildTicks() {
    const minorGroup = document.getElementById('ticks-minor');
    const majorGroup = document.getElementById('ticks-major');
    if (!minorGroup || !majorGroup) return;

    // Major cardinal / intercardinal ticks every 22.5°
    const majorCardinals = [
      { deg: 0,   label: 'N',   cls: 'cardinal-label-nsew' },
      { deg: 45,  label: 'NE',  cls: '' },
      { deg: 90,  label: 'E',   cls: 'cardinal-label-nsew' },
      { deg: 135, label: 'SE',  cls: '' },
      { deg: 180, label: 'S',   cls: 'cardinal-label-nsew' },
      { deg: 225, label: 'SW',  cls: '' },
      { deg: 270, label: 'W',   cls: 'cardinal-label-nsew' },
      { deg: 315, label: 'NW',  cls: '' },
    ];

    for (const { deg, label, cls } of majorCardinals) {
      const inner = polarToXY(deg, RING_R - 10);
      const outer = polarToXY(deg, RING_R + 2);
      const tick  = document.createElementNS(SVG_NS, 'line');
      tick.setAttribute('x1', inner.x); tick.setAttribute('y1', inner.y);
      tick.setAttribute('x2', outer.x); tick.setAttribute('y2', outer.y);
      tick.setAttribute('class', 'cardinal-tick-major');
      majorGroup.appendChild(tick);

      const labelPt = polarToXY(deg, RING_R + 18);
      const text = document.createElementNS(SVG_NS, 'text');
      text.setAttribute('x', labelPt.x);
      text.setAttribute('y', labelPt.y);
      text.setAttribute('class', `cardinal-label ${cls}`);
      text.textContent = label;
      majorGroup.appendChild(text);
    }

    // Fine ticks every 10° (skip where major)
    for (let d = 0; d < 360; d += 10) {
      if (d % 45 === 0) continue;
      const inner = polarToXY(d, RING_R - 6);
      const outer = polarToXY(d, RING_R);
      const tick  = document.createElementNS(SVG_NS, 'line');
      tick.setAttribute('x1', inner.x); tick.setAttribute('y1', inner.y);
      tick.setAttribute('x2', outer.x); tick.setAttribute('y2', outer.y);
      tick.setAttribute('class', 'cardinal-tick');
      minorGroup.appendChild(tick);
    }
  }

  // ── Update beam SVG elements ───────────────────────────────────
  function updateBeam(angleDeg) {
    const beam    = document.getElementById('dir-beam');
    const ray     = document.getElementById('dir-ray');
    const arrow   = document.getElementById('dir-arrow');
    const tip     = document.getElementById('dir-tip');
    const wedge   = document.getElementById('dir-wedge');
    if (!beam) return;

    beam.style.display = 'block';

    const tip_pt  = polarToXY(angleDeg, BEAM_R);
    const near_pt = polarToXY(angleDeg, 22);

    // Ray line
    ray.setAttribute('x1', near_pt.x); ray.setAttribute('y1', near_pt.y);
    ray.setAttribute('x2', tip_pt.x);  ray.setAttribute('y2', tip_pt.y);

    // Arrowhead (equilateral triangle pointing outward)
    const A_SIZE = 9;
    const tipPerpL = polarToXY(angleDeg + 90, A_SIZE * 0.5, tip_pt.x - polarToXY(angleDeg, A_SIZE * 0.9).x + tip_pt.x, tip_pt.y - polarToXY(angleDeg, A_SIZE * 0.9).y + tip_pt.y);

    // Simpler arrowhead using angle math
    const rad = (angleDeg - 90) * (Math.PI / 180);
    const ax = tip_pt.x, ay = tip_pt.y;
    const bx = ax - A_SIZE * Math.cos(rad) + (A_SIZE * 0.5) * Math.sin(rad);
    const by = ay - A_SIZE * Math.sin(rad) - (A_SIZE * 0.5) * Math.cos(rad);
    const cx2 = ax - A_SIZE * Math.cos(rad) - (A_SIZE * 0.5) * Math.sin(rad);
    const cy2 = ay - A_SIZE * Math.sin(rad) + (A_SIZE * 0.5) * Math.cos(rad);
    arrow.setAttribute('points', `${ax},${ay} ${bx},${by} ${cx2},${cy2}`);

    // Endpoint dot
    tip.setAttribute('cx', tip_pt.x);
    tip.setAttribute('cy', tip_pt.y);

    // Wedge (field-of-view indicator, ±20° from center direction)
    const HALF_FOV = 20;
    const leftPt  = polarToXY(angleDeg - HALF_FOV, RING_R * 0.85);
    const rightPt = polarToXY(angleDeg + HALF_FOV, RING_R * 0.85);
    wedge.setAttribute('d',
      `M ${CX} ${CY} L ${leftPt.x} ${leftPt.y} A ${RING_R * 0.85} ${RING_R * 0.85} 0 0 1 ${rightPt.x} ${rightPt.y} Z`
    );
  }

  // ── Hit test: SVG coords from pointer event ────────────────────
  function svgCoordsFromEvent(svg, e) {
    const rect = svg.getBoundingClientRect();
    const svgSize = rect.width; // widget is square
    const scale = 320 / svgSize;
    const touch = e.touches ? e.touches[0] : e;
    return {
      x: (touch.clientX - rect.left) * scale,
      y: (touch.clientY - rect.top)  * scale,
    };
  }

  function angleFromCenter(x, y) {
    const dx = x - CX, dy = y - CY;
    const rad = Math.atan2(dy, dx);
    return normalizeAngle((rad * 180 / Math.PI) + 90);
  }

  function distFromCenter(x, y) {
    return Math.sqrt((x - CX) ** 2 + (y - CY) ** 2);
  }

  // ── State ──────────────────────────────────────────────────────
  let currentAngle = null;
  let dragging = false;
  let _onConfirm = null;
  let leafletMap = null;
  let mapInitialized = false;

  // ── Leaflet map inside widget ──────────────────────────────────
  function initLeafletMap(lat, lon) {
    if (mapInitialized) {
      if (lat != null && lon != null) leafletMap.setView([lat, lon], 18);
      return;
    }
    leafletMap = L.map('dir-map', {
      zoomControl: false,
      attributionControl: false,
      dragging: false,
      touchZoom: false,
      scrollWheelZoom: false,
      doubleClickZoom: false,
      keyboard: false,
      tap: false,
    }).setView([lat ?? 51.505, lon ?? -0.09], 18);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
    }).addTo(leafletMap);

    mapInitialized = true;
  }

  // ── Update readout display ─────────────────────────────────────
  function updateReadout(deg) {
    const rounded = Math.round(normalizeAngle(deg));
    const cardinal = degreesToCardinal(rounded);
    const readout   = document.getElementById('dir-readout');
    const readDeg   = document.getElementById('readout-deg');
    const readCard  = document.getElementById('readout-card');
    if (!readout) return;
    readout.classList.add('visible');
    readDeg.textContent  = `${rounded}°`;
    readCard.textContent = cardinal;
    updateBeam(deg);
    return { deg: rounded, cardinal };
  }

  // ── Show save-status flash ─────────────────────────────────────
  function flashSaveStatus(deg, cardinal) {
    const el    = document.getElementById('dir-save-status');
    const valEl = document.getElementById('save-status-value');
    if (!el) return;
    valEl.textContent = `${deg}° ${cardinal}`;
    el.classList.add('visible');
    setTimeout(() => el.classList.remove('visible'), 750);
  }

  // ── Wire up drag interaction ───────────────────────────────────
  function bindDrag() {
    const svg     = document.getElementById('dir-canvas');
    const confirm = document.getElementById('btn-dir-confirm');
    if (!svg) return;

    function onMove(e) {
      if (!dragging) return;
      e.preventDefault();
      const { x, y } = svgCoordsFromEvent(svg, e);
      if (distFromCenter(x, y) < DEAD_R) return;
      currentAngle = angleFromCenter(x, y);
      updateReadout(currentAngle);
    }

    function onDown(e) {
      const { x, y } = svgCoordsFromEvent(svg, e);
      if (distFromCenter(x, y) < DEAD_R) return;
      dragging = true;
      currentAngle = angleFromCenter(x, y);
      updateReadout(currentAngle);
      e.preventDefault();
    }

    function onUp() {
      if (!dragging) return;
      dragging = false;
      if (currentAngle != null && confirm) {
        confirm.classList.add('visible');
      }
    }

    svg.addEventListener('pointerdown',  onDown,  { passive: false });
    svg.addEventListener('pointermove',  onMove,  { passive: false });
    svg.addEventListener('pointerup',    onUp);
    svg.addEventListener('pointercancel',onUp);

    // Touch fallback
    svg.addEventListener('touchstart',  onDown,  { passive: false });
    svg.addEventListener('touchmove',   onMove,  { passive: false });
    svg.addEventListener('touchend',    onUp);
  }

  // ── Public API ─────────────────────────────────────────────────
  function open({ lat, lon, initialAngle, onConfirm }) {
    currentAngle = initialAngle ?? null;
    _onConfirm   = onConfirm;
    dragging     = false;

    const overlay = document.getElementById('dir-overlay');
    const confirm = document.getElementById('btn-dir-confirm');
    const readout = document.getElementById('dir-readout');
    const beam    = document.getElementById('dir-beam');

    // Reset state
    if (confirm) confirm.classList.remove('visible');
    if (readout) readout.classList.remove('visible');
    if (beam)    beam.style.display = 'none';

    // If there's an existing angle, show it
    if (initialAngle != null) {
      updateReadout(initialAngle);
      if (confirm) confirm.classList.add('visible');
    }

    initLeafletMap(lat, lon);
    // Give Leaflet a tick to size up before invalidating
    setTimeout(() => leafletMap?.invalidateSize(), 50);

    overlay.classList.add('visible');
  }

  function close() {
    const overlay = document.getElementById('dir-overlay');
    overlay.classList.remove('visible');
    currentAngle = null;
    _onConfirm   = null;
  }

  function bindButtons() {
    document.getElementById('btn-dir-confirm')?.addEventListener('click', () => {
      if (currentAngle == null) return;
      const deg      = Math.round(normalizeAngle(currentAngle));
      const cardinal = degreesToCardinal(deg);
      if (_onConfirm) _onConfirm({ deg, cardinal });
      flashSaveStatus(deg, cardinal);
      close();
    });

    document.getElementById('btn-dir-cancel')?.addEventListener('click', close);
    document.getElementById('dir-dismiss')?.addEventListener('click', close);
  }

  // ── Init ───────────────────────────────────────────────────────
  function init() {
    buildTicks();
    bindDrag();
    bindButtons();
  }

  return { init, open, close, degreesToCardinal, normalizeAngle };
})();
