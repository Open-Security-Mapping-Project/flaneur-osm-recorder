## .gitlab-ci.yml
## Flaneur OSM Recorder — GitLab CI
## SPDX-License-Identifier: GPL-3.0-or-later

stages:
  - lint
  - build

default:
  image: node:20-alpine
  before_script:
    - npm ci

lint:
  stage: lint
  script:
    - npm run lint:check
    - npm run format:check
  cache:
    key: node-modules
    paths:
      - node_modules/

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  cache:
    key: node-modules
    paths:
      - node_modules/
